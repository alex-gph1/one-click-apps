captainVersion: 4

services:
    $$cap_appname:
        image: $$cap_tuwunel_image:$$cap_tuwunel_tag
        restart: unless-stopped
        volumes:
            - $$cap_appname-data:/var/lib/tuwunel
        environment:
            TUWUNEL_SERVER_NAME: $$cap_appname.$$cap_root_domain
            TUWUNEL_ADDRESS: 0.0.0.0
            TUWUNEL_PORT: '8008'
            TUWUNEL_DATABASE_PATH: /var/lib/tuwunel
            TUWUNEL_MAX_REQUEST_SIZE: $$cap_max_request_size
            TUWUNEL_ALLOW_REGISTRATION: $$cap_allow_registration
            TUWUNEL_REGISTRATION_TOKEN: $$cap_registration_token
            TUWUNEL_ALLOW_FEDERATION: $$cap_allow_federation
            TUWUNEL_TRUSTED_SERVERS: '["matrix.org"]'
            TUWUNEL_WELL_KNOWN__CLIENT: https://$$cap_appname.$$cap_root_domain
            TUWUNEL_WELL_KNOWN__SERVER: $$cap_appname.$$cap_root_domain:443
            TUWUNEL_IP_SOURCE: $$cap_ip_source
            TUWUNEL_LOG: $$cap_log
        caproverExtra:
            containerHttpPort: '8008'
            websocketSupport: 'true'

caproverOneClickApp:
    variables:
        - id: $$cap_tuwunel_image
          label: Tuwunel Image
          description: Official upstream container image. GHCR is preferred by the upstream project.
          defaultValue: ghcr.io/matrix-construct/tuwunel
          validRegex: /.{1,}/
        - id: $$cap_tuwunel_tag
          label: Tuwunel Image Tag
          description: Upstream recommends latest for stable automatic updates. Use a release tag if you want pinning.
          defaultValue: latest
          validRegex: /.{1,}/
        - id: $$cap_allow_registration
          label: Allow Registration
          description: Keep true with the token below for first-account creation. The first registered account becomes server admin.
          defaultValue: 'true'
          validRegex: /^(true|false)$/
        - id: $$cap_registration_token
          label: Registration Token
          description: Required when registration is enabled. Save this value and enter it in your Matrix client during registration.
          defaultValue: $$cap_gen_random_hex(32)
          validRegex: /.{8,}/
        - id: $$cap_allow_federation
          label: Allow Federation
          defaultValue: 'true'
          validRegex: /^(true|false)$/
        - id: $$cap_max_request_size
          label: Max Request Size
          description: Max upload/request size in bytes.
          defaultValue: '20000000'
          validRegex: /^[0-9]+$/
        - id: $$cap_ip_source
          label: Client IP Source
          description: Use rightmost_x_forwarded_for when Tuwunel is reachable only through CapRover's trusted reverse proxy.
          defaultValue: rightmost_x_forwarded_for
          validRegex: /.{1,}/
        - id: $$cap_log
          label: Log Filter
          description: Tuwunel tracing filter, for example info, warn, or warn,state_res=warn.
          defaultValue: info
          validRegex: /^(debug|info|warn|error)(,.*)?$/
    instructions:
        start: |-
            Tuwunel is a Matrix homeserver. This template deploys a single Tuwunel container with persistent RocksDB storage at /var/lib/tuwunel.

            Choose the CapRover App Name carefully. This template uses the resulting app domain as the Matrix Server Name, which becomes part of every user ID and room ID. Upstream documents the server name as immutable after first startup unless you wipe the database.

            By default, registration is enabled but protected by the generated registration token. Save that token before finishing installation. The first registered account is granted server admin.

            CapRover should expose this app over HTTPS. The Matrix homeserver name, client URL, and federation target are inferred from the app name and CapRover root domain during deployment.
        end: |-
            Tuwunel has been deployed.

            Homeserver URL: https://$$cap_appname.$$cap_root_domain
            Health check: https://$$cap_appname.$$cap_root_domain/_tuwunel/server_version

            Register the first Matrix account against server name $$cap_appname.$$cap_root_domain. If registration is enabled, use this registration token:
            $$cap_registration_token

            For federation, make sure public DNS points to this CapRover app and verify the Matrix federation tester. This template serves well-known values for https://$$cap_appname.$$cap_root_domain and $$cap_appname.$$cap_root_domain:443.
    displayName: Tuwunel Matrix Homeserver
    isOfficial: 'true'
    description: Tuwunel Matrix homeserver with persistent RocksDB storage, token-gated registration, and CapRover HTTPS defaults.
    documentation: |-
        Upstream repository: https://github.com/matrix-construct/tuwunel
        Docker deployment docs: https://matrix-construct.github.io/tuwunel/deploying/docker.html
        Generic deployment docs: https://matrix-construct.github.io/tuwunel/deploying/generic.html
