captainVersion: 4
services:
    $$cap_appname:
        image: ghcr.io/dagucloud/dagu:$$cap_dagu_tag
        restart: unless-stopped
        command:
            - dagu
            - start-all
        environment:
            DAGU_HOST: 0.0.0.0
            DAGU_PORT: '8080'
            DAGU_PUBLIC_URL: https://$$cap_appname.$$cap_root_domain
            DAGU_TZ: $$cap_dagu_timezone
            DAGU_AUTH_MODE: builtin
            DAGU_AUTH_TOKEN_SECRET: $$cap_dagu_token_secret
            DAGU_AUTH_BUILTIN_INITIAL_ADMIN_USERNAME: $$cap_dagu_admin_username
            DAGU_AUTH_BUILTIN_INITIAL_ADMIN_PASSWORD: $$cap_dagu_admin_password
            PUID: $$cap_dagu_puid
            PGID: $$cap_dagu_pgid
        volumes:
            - $$cap_appname-data:/var/lib/dagu
        caproverExtra:
            containerHttpPort: '8080'

caproverOneClickApp:
    variables:
        - id: $$cap_dagu_tag
          label: Dagu Image Tag
          description: Use latest for the current stable Dagu container, or pin a release tag for controlled upgrades.
          defaultValue: latest
          validRegex: /^[A-Za-z0-9_.-]+$/
        - id: $$cap_dagu_timezone
          label: Dagu Timezone
          description: Timezone used by Dagu schedules and the web UI.
          defaultValue: Asia/Manila
          validRegex: /^\S+$/
        - id: $$cap_dagu_admin_username
          label: Initial Admin Username
          description: First built-in Dagu admin account created on initial startup when no users exist.
          defaultValue: admin
          validRegex: /^[A-Za-z0-9_.@-]{3,64}$/
        - id: $$cap_dagu_admin_password
          label: Initial Admin Password
          description: Save this password before deployment. It is used for the first built-in Dagu admin account.
          defaultValue: $$cap_gen_random_hex(32)
          validRegex: /.{16,}/
        - id: $$cap_dagu_token_secret
          label: Auth Token Secret
          description: Secret used to sign built-in authentication sessions.
          defaultValue: $$cap_gen_random_hex(64)
          validRegex: /.{32,}/
        - id: $$cap_dagu_puid
          label: Container User ID
          description: Numeric user ID for files written to the persistent Dagu volume.
          defaultValue: '1000'
          validRegex: /^[0-9]+$/
        - id: $$cap_dagu_pgid
          label: Container Group ID
          description: Numeric group ID for files written to the persistent Dagu volume.
          defaultValue: '1000'
          validRegex: /^[0-9]+$/
    instructions:
        start: |-
            Dagu will be deployed as a single-container workflow orchestration server with its web UI, scheduler, coordinator, and executor running through dagu start-all.

            This template follows the official Docker install path: the Dagu image is pulled from GitHub Container Registry, the web UI listens on port 8080, and workflows, history, logs, users, and settings persist under /var/lib/dagu.

            Built-in authentication is enabled by default. Save the initial admin username and generated password before finishing installation.

            This template intentionally does not mount the host Docker socket. Dagu workflows that need to run Docker containers require a separate, security-reviewed deployment change because Docker socket access grants broad control over the host.
        end: |-
            Dagu has been deployed.

            Web UI:
            - https://$$cap_appname.$$cap_root_domain/

            Initial admin credentials:
            - Username: $$cap_dagu_admin_username
            - Password: $$cap_dagu_admin_password

            Persistent data:
            - $$cap_appname-data mounted at /var/lib/dagu

            Verify from the CapRover host if needed:
            - docker exec $(docker ps --filter name=srv-captain--$$cap_appname -q | head -n 1) dagu version

            Docker-based workflow steps are not enabled by this template because the host Docker socket is not mounted.
    displayName: Dagu
    isOfficial: true
    description: Lightweight self-hosted workflow orchestration with a web UI, scheduler, and file-backed state.
    documentation: |-
        Docker installation: https://docs.dagu.sh/getting-started/installation/docker
        Server configuration: https://docs.dagu.sh/server-admin/server
