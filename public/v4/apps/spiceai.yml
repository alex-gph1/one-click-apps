captainVersion: 4
services:
    $$cap_appname-init:
        image: alpine:3.20
        restart: 'no'
        command:
            - sh
            - -c
            - |
                set -e
                chown -R 65534:65534 /data /state
                chmod -R u+rwX /data /state
                sleep 100d
        user: root
        volumes:
            - $$cap_appname-data:/data
            - $$cap_appname-state:/state
        caproverExtra:
            notExposeAsWebApp: true

    $$cap_appname:
        restart: on-failure:5
        environment:
            SPICE_API_KEY: $$cap_api_key
        depends_on:
            - $$cap_appname-init
        volumes:
            - $$cap_appname-data:/app/data
            - $$cap_appname-state:/app/.spice
        caproverExtra:
            dockerfileLines:
                - FROM debian:trixie-slim AS spicepod
                - ARG SPICEPOD_NAME=$$cap_spicepod_name
                - |-
                    RUN mkdir -p /app && cat > /app/spicepod.yaml <<EOF
                    version: v1beta1
                    kind: Spicepod
                    name: ${SPICEPOD_NAME}
                    runtime:
                      auth:
                        api-key:
                          enabled: true
                          keys:
                            - \${env:SPICE_API_KEY}
                    EOF
                - FROM spiceai/spiceai:$$cap_spiceai_version
                - COPY --from=spicepod --chown=65534:65534 /app/spicepod.yaml /app/spicepod.yaml
                - CMD ["--http","0.0.0.0:8090","--metrics","0.0.0.0:9090","--flight","0.0.0.0:50051"]
            containerHttpPort: '8090'

caproverOneClickApp:
    variables:
        - id: $$cap_spiceai_version
          label: Spice.ai Docker Image Tag
          defaultValue: 1.11.6
          description: Use a stable Spice.ai runtime tag. Use latest-models for AI features including embeddings, models, and search.
          validRegex: /^([^\s^\/])+$/

        - id: $$cap_api_key
          label: Spice API Key
          defaultValue: $$cap_gen_random_hex(32)
          description: API key required for Spice HTTP and Flight SQL requests. Health and readiness endpoints remain public.
          validRegex: /.{16,}/

        - id: $$cap_spicepod_name
          label: Spicepod Name
          defaultValue: $$cap_appname
          description: Name written into the starter spicepod.yaml. Replace the generated spicepod with your own configuration for real datasets, catalogs, models, or tools.
          validRegex: /^[a-zA-Z0-9][a-zA-Z0-9_-]*$/

    instructions:
        start: |-
            Spice.ai OSS will be deployed as a portable SQL query and AI runtime.

            This one-click app creates a minimal starter spicepod.yaml so the runtime can boot. API key authentication is enabled by default. For real use, prepare a custom Spicepod configuration with your datasets, catalogs, models, tools, and any required secrets.

            The public CapRover route exposes the Spice HTTP API on port 8090. The runtime also listens internally on port 9090 for metrics and 50051 for Apache Arrow Flight/gRPC.
        end: |-
            Spice.ai OSS has been deployed.

            Public HTTP API:
            - https://$$cap_appname.$$cap_root_domain/
            - Send the API key in the X-API-Key header: $$cap_api_key

            Persistent data volumes:
            - $$cap_appname-data mounted at /app/data
            - $$cap_appname-state mounted at /app/.spice

            The generated spicepod.yaml is only a starter file. To run useful workloads, build or deploy a custom Spice.ai image with your spicepod.yaml, or update the service image/configuration after installation.

            Metrics on 9090 and Flight/gRPC on 50051 are not exposed through the default CapRover web route. Add separate routing or internal consumers if you need those endpoints.

    displayName: Spice.ai OSS
    isOfficial: false
    description: Portable SQL query and AI runtime for data-grounded apps, agents, and accelerated data access.
    documentation: https://spiceai.org/docs
