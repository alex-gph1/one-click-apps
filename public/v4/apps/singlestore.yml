captainVersion: 4
services:
    $$cap_appname:
        image: ghcr.io/singlestore-labs/singlestoredb-dev:$$cap_singlestore_image_tag
        restart: unless-stopped
        environment:
            ROOT_PASSWORD: $$cap_root_password
            SINGLESTORE_LICENSE: $$cap_singlestore_license
            SINGLESTORE_VERSION: $$cap_singlestore_version
            ENABLE_KAI: $$cap_enable_kai
        volumes:
            - $$cap_appname-data:/data
            - $$cap_appname-logs:/logs
        caproverExtra:
            containerHttpPort: '8080'

caproverOneClickApp:
    variables:
        - id: $$cap_singlestore_image_tag
          label: SingleStore Dev Image Tag
          defaultValue: 0.2.81
          description: Pinned ghcr.io/singlestore-labs/singlestoredb-dev image tag. Use latest only if you accept moving upgrades.
          validRegex: /^[A-Za-z0-9_.-]+$/

        - id: $$cap_root_password
          label: Root Password
          defaultValue: $$cap_gen_random_hex(32)
          description: Password for the SingleStore root user and Studio login. Save it before deployment.
          validRegex: /.{12,}/

        - id: $$cap_singlestore_license
          label: SingleStore License
          defaultValue: ''
          description: Optional. Leave blank to use the free dev-image license bundled by SingleStore, or paste your own license key.

        - id: $$cap_singlestore_version
          label: SingleStore Runtime Version
          defaultValue: ''
          description: Optional. Leave blank to use the version baked into the image tag, or set values like 9.0 or rc:9.1.
          validRegex: /^$|^(rc:[0-9]+\.[0-9]+|[0-9]+(\.[0-9]+){0,2}(-[A-Za-z0-9]+)?)$/

        - id: $$cap_enable_kai
          label: Enable Kai MongoDB API
          defaultValue: 'false'
          description: Set to true to start SingleStore Kai internally on port 27017 for MongoDB-compatible clients.
          validRegex: /^(true|false|1|0)$/

    instructions:
        start: |-
            SingleStoreDB Dev Image will be deployed as a one-node development cluster with Studio, the MySQL-compatible SQL endpoint, and the Data API.

            This image is intended for development, prototyping, CI, and functional testing. It is not supported by SingleStore for production workloads or benchmarks.

            CapRover will route the public web app to SingleStore Studio on port 8080. The MySQL endpoint on 3306, Data API on 9000, and optional Kai endpoint on 27017 remain internal Docker-network endpoints unless you manually add separate secured routing.

            On hosts with more than 8 CPU cores or 64GB RAM, review SingleStore licensing and resource-limit requirements before relying on this deployment.
        end: |-
            SingleStoreDB Dev Image has been deployed.

            Studio UI:
            - https://$$cap_appname.$$cap_root_domain/
            - Username: root
            - Password: $$cap_root_password

            Internal endpoints for other CapRover apps:
            - MySQL protocol: srv-captain--$$cap_appname:3306
            - Data API: http://srv-captain--$$cap_appname:9000/api/v1/query/rows
            - Kai MongoDB API, if enabled: srv-captain--$$cap_appname:27017

            Persistent volumes:
            - $$cap_appname-data mounted at /data
            - $$cap_appname-logs mounted at /logs

            Smoke test from the CapRover host:
            - docker exec $(docker ps --filter name=srv-captain--$$cap_appname -q | head -n 1) singlestore -p$$cap_root_password -e "SELECT 1"

            The public CapRover route exposes Studio only. Avoid publishing database ports directly unless you have a reviewed network and authentication plan.

    displayName: SingleStoreDB Dev
    isOfficial: true
    description: SingleStoreDB dev image with Studio UI, MySQL protocol, Data API, optional Kai, and persistent dev data.
    documentation: https://github.com/singlestore-labs/singlestoredb-dev-image
